version: '3.1'
services:
  zalo-bridge:
    profiles: ["zalo"]
    build: ./services/zalo-bridge
    # Zalo currently times out during the default TLS handshake on production.
    # TLS 1.2 works; certificate verification remains enabled.
    command: ["node", "--tls-max-v1.2", "src/main.mjs"]
    restart: unless-stopped
    env_file:
      - path: .env.zalo
        required: false
    volumes:
      - zalo-bridge-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "5432:5432"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./required-addons:/mnt/enterprise
      - ./custom-addons:/mnt/extra-addons
    command: -u vnpt_base
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
volumes:
  zalo-bridge-data:
  odoo-web-data:
  odoo-db-data:
